name: Analisis CodeQL

on:
  pull_request:
    branches:
      - local
      - develop
      - staging
      - main
  workflow_dispatch:
  schedule:
    - cron: "25 18 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analisis keamanan CodeQL
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # CodeQL belum mendukung PHP, jadi PHP tidak ikut dipindai di sini.
        language:
          - javascript-typescript
          - actions

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inisialisasi CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Jalankan analisis CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
